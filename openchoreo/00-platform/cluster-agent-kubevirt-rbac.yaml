# Lets the data-plane cluster agent apply/read/delete KubeVirt objects rendered by the
# vm-service ComponentType. Kept separate from the Helm-managed ClusterRole
# (cluster-agent-dataplane-openchoreo-data-plane) so a Helm upgrade does not drop it.
# Product follow-up: expose an "extraRules" value in the data-plane Helm chart.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-agent-dataplane-kubevirt
rules:
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachines", "virtualmachineinstances"]
    verbs: ["*"]
  - apiGroups: ["pool.kubevirt.io"]
    resources: ["virtualmachinepools", "virtualmachinepools/scale"]
    verbs: ["*"]
  - apiGroups: ["subresources.kubevirt.io"]
    resources: ["virtualmachines/restart", "virtualmachines/start", "virtualmachines/stop"]
    verbs: ["update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-agent-dataplane-kubevirt
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-agent-dataplane-kubevirt
subjects:
  - kind: ServiceAccount
    name: cluster-agent-dataplane
    namespace: openchoreo-data-plane
