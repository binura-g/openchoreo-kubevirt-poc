# Secret value lives in OpenBao (dev mode on the local cluster). Seed it with:
#   kubectl -n openbao exec openbao-0 -- env BAO_TOKEN=root bao kv put secret/vm-poc-greeter api-key=s3cr3t-from-openbao tls.crt=dummy-cert
apiVersion: openchoreo.dev/v1alpha1
kind: SecretReference
metadata:
  name: greeter-vm-secrets
  namespace: default
spec:
  refreshInterval: 1h
  data:
    - secretKey: api-key
      remoteRef:
        key: vm-poc-greeter
        property: api-key
    - secretKey: tls.crt
      remoteRef:
        key: vm-poc-greeter
        property: tls.crt
  template:
    type: Opaque
